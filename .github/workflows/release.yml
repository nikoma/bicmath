name: Release candidate artifacts

# Builds release binaries and checksums for owner review. It does not publish
# to crates.io or any registry; publication requires an explicit owner action.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../bicmath-${{ matrix.target }}.tar.gz bicmath
          cd ../../..
          shasum -a 256 bicmath-${{ matrix.target }}.tar.gz > bicmath-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/bicmath.exe -DestinationPath bicmath-${{ matrix.target }}.zip
          (Get-FileHash bicmath-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  bicmath-${{ matrix.target }}.zip" | Out-File -Encoding ascii bicmath-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bicmath-${{ matrix.target }}
          path: |
            bicmath-${{ matrix.target }}.tar.gz
            bicmath-${{ matrix.target }}.tar.gz.sha256
            bicmath-${{ matrix.target }}.zip
            bicmath-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore
