[package]
name = "bicmath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The BicMath command line interface and native MCP server."

[[bin]]
name = "bicmath"
path = "src/main.rs"

[features]
default = []
http = ["bicmath-mcp/http"]

[dependencies]
bicmath-core.workspace = true
bicmath-engine.workspace = true
bicmath-mcp.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
