description = "Registry assembly, validation, expression evaluation, batches, and receipts for BicMath."

[features]
default = ["arithmetic", "scientific", "statistics", "finance", "units", "linear-algebra", "interval", "verify", "symbolic", "optimize", "algebra", "geometry", "business", "format", "plan"]
arithmetic = ["dep:bicmath-arithmetic"]
scientific = ["dep:bicmath-scientific"]
statistics = ["dep:bicmath-statistics"]
finance = ["dep:bicmath-finance"]
units = ["dep:bicmath-units"]
linear-algebra = ["dep:bicmath-linear-algebra"]
plan = ["dep:bicmath-plan"]
format = ["dep:bicmath-format"]
